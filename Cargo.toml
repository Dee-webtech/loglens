[package]
name = "loglens"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Lightweight multi-tenant log ingestion and search server"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[dev-dependencies]
criterion = "0.5"
tempfile = "3"
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"

[[bench]]
name = "search"
harness = false

[profile.release]
lto = "thin"